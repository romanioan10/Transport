<div style="padding: 20px; max-width: 400px; margin: 50px auto; border: 1px solid #ccc; text-align: center;">
  <h2>Autentificare Transport</h2>

  <div style="margin-bottom: 15px;">
    <label>Email:</label><br>
    <input type="email" [(ngModel)]="email" placeholder="tata@transport.ro" style="padding: 10px; width: 100%;">
  </div>

  <div style="margin-bottom: 15px;">
    <label>Parola:</label><br>
    <input type="password" [(ngModel)]="password" placeholder="Parola..." style="padding: 10px; width: 100%;">
  </div>

  <button (click)="onLogin()" style="padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer;">
    Intră în cont
  </button>

  <p *ngIf="errorMessage" style="color: red; margin-top: 10px;">{{ errorMessage }}</p>
</div>
